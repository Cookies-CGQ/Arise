worker_processes 2;
error_log /home/ayanami/myfile/learn/Arise/Arise/deploy/nginx_error.log;
pid /home/ayanami/myfile/learn/Arise/Arise/deploy/nginx.pid;

events {
    worker_connections 4096;
}

http {
    access_log off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30;
    keepalive_requests 1000;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root /home/ayanami/myfile/learn/Arise/Arise/web;

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass unix:/home/ayanami/myfile/learn/Arise/Arise/deploy/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_keep_conn on;
        }
    }
}
