# 所有服务都配置到同一个进程，方便测试
allinone:
  thread_logic: 1 # 逻辑线程数
  thread_mysql: 1 # mysql线程数
  ip: 127.0.0.1
  port: 5401

# 服务管理进程配置
appmgr:
  thread_logic: 2 # 逻辑线程数
  ip: 127.0.0.1
  port: 5500

# # 单login服务进程配置
# login:
#   thread_logic: 2
#   url_login: http://192.168.0.120/member_login_t.php # 第三方平台账号验证
#   ip: 127.0.0.1
#   port: 5401

# 多login服务进程配置
login:
  thread_logic: 2
  url_login: http://192.168.1.120/member_login_t.php # 第三方平台账号验证的URL
  url_method: "get" # HTTP 请求方法
  apps:
    - id: 101
      ip: 127.0.0.1
      port: 5401
    - id: 102
      ip: 127.0.0.1
      port: 5402

# 数据库服务进程配置
dbmgr:
  thread_logic: 1
  thread_mysql: 2
  ip: 127.0.0.1
  port: 5800
  dbs:
    # redis配置
    - type: redis
      ip: 192.168.0.120
      port: 6379

    # mysql配置
    - type: mysql
      ip: 192.168.0.120
      port: 3306
      user: root
      password: 123456
      database_name: e_gamedata
      character_set: utf8
      collation: utf8_general_ci

robot:
  thread_logic: 10