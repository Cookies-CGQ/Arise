# 进程配置文件

# 所有服务都配置到同一个进程，方便测试
allinone:
  thread_logic: 2 # 逻辑线程数
  thread_mysql: 2 # mysql线程数
  thread_listen: 2 # 网络监听线程数
  thread_connector: 1 # 网络连接线程数
  ip: 127.0.0.1
  port: 5401          # tcp
  http_port: 7071     # http

# 服务管理进程配置
appmgr:
  thread_logic: 2 # 逻辑线程数
  thread_listen: 2
  thread_connector: 2
  ip: 127.0.0.1
  port: 5500
  http_port: 7071

