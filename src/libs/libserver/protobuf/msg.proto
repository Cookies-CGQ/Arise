syntax = "proto3";

package Proto;

// 协议：客户端发送账号验证请求给服务端
message AccountCheck {
	string account = 1;
	string password = 2;
}

// 协议：服务端返回账号验证结果给客户端
message AccountCheckRs {
	enum ReturnCode {
		ARC_OK = 0;
		ARC_UNKONWN = 1;
		ARC_NOT_FOUND_ACCOUNT = 2;
		ARC_PASSWORD_WRONG = 3;
		ARC_LOGGING = 4; // 正在登录
		ARC_TIMEOUT = 5; // 超时
	}

	int32 return_code = 1;
}

// 协议：第三方登录验证结果发给服务端
message AccountCheckToHttpRs {
	int32 return_code = 1;	// AccountCheckRs::ReturnCode
	string account = 2;
}

message RobotState {
	string account = 1;
	int32 state = 2;
}

message RobotSyncState {
	repeated RobotState states = 1;
}

message RobotTestEnd {
	int32 state = 1;
}
